<VirtualHost *:8080>
    ServerName rates.delamibrands.com
    DocumentRoot /var/www/html/public

    # Caddy is the only caller because Docker publishes this container on the
    # host loopback interface. Preserve the original scheme and client IP so
    # CI4's HTTPS enforcement, throttling, and audit logs see the real request.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1
    RemoteIPTrustedProxy 172.16.0.0/12

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
